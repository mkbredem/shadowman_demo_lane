---
# Demo lane rulebook (Phase 1: automation orchestrator flow only).
# Listens only to the Datadog_v2 event stream, which receives alerts from the
# Datadog monitors "Web Server is Down_v2" and "CPU Load is high_v2"
# (scope env:shadowman_v2). The legacy "Datadog" event stream and its five
# rulebooks never see these alerts.
#
# Routing: the host name carries the demo flow, for example
#   mbredeme-1104-ao-datadog.shadowman.dev  -> flow "ao"
# Phase 2 adds rules for the flows classic, ai, aimcp and snowlogs.
#
# Activation extra variables:
#   ao_webhook_path: c8c4e8c2-9a00-4ee2-a1cc-03c5f87a6798   (AIOps Workflow With EDA trigger)
- name: Datadog demo lane v2
  hosts: all
  sources:
    - name: Listen for alerts from Datadog v2
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: AO flow - Web Application Down Detected
      condition: >-
        event.payload.event_title == "[Triggered] Web Server is Down_v2"
        and event.payload.hostname is search("-ao-datadog\\.", ignorecase=true)
      action:
        run_job_template:
          name: "EDA Automated Response Automation Orchestrator"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "httpd"
              ao_webhook_path: "{{ ao_webhook_path }}"

    - name: AO flow - High CPU Usage Detected
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-ao-datadog\\.", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Enrichment CPU"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"

    - name: Log demo lane alerts that no flow handles
      condition: >-
        event.payload.event_title is defined
        and not (event.payload.hostname is search("-ao-datadog\\.", ignorecase=true))
      action:
        debug:
          msg: "No demo flow matched {{ event.payload.hostname }}: {{ event.payload.event_title }}"
