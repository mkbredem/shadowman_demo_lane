---
# Demo lane rulebook. Flows: ao (Phase 1), classic, ai, aimcp and snowlogs (Phase 2).
# Listens only to the Datadog_v2 event stream, which receives alerts from the
# Datadog monitors "Web Server is Down_v2" and "CPU Load is high_v2"
# (scope env:shadowman_v2). The legacy "Datadog" event stream and its five
# rulebooks never see these alerts.
#
# Routing: the host name carries the demo flow, for example
#   mbredeme-1104-ao-datadog.shadowman.dev  -> flow "ao"
#   mbredeme-1105-classic-datadog.shadowman.dev -> flow "classic"
# The classic rules are the rules of activation 4 "Datadog" (rulebook
# datadog.yml), limited to -classic- hosts. Its "Host not reporting data" rule
# is left out on purpose: the demo lane has no such monitor, so a teardown
# never raises an alert.
# The ai rules are the rules of activation 10 "Datadog AI" (rulebook
# datadogai.yml), limited to -ai- hosts ("-ai-datadog." does not match
# -aimcp- hosts). Host not reporting data rule left out, as for classic.
# The aimcp rules are the rules of activation 37 "Datadog AI MCP" (rulebook
# datadogaimcp.yml), limited to -aimcp- hosts. Its httpd workflow stops at the
# approval "Use Ansible MCP": the presenter fixes httpd through an MCP client
# connected to AAP, then approves, and the workflow closes the ticket.
# The snowlogs rule is the only rule of activation 11 "Datadog with
# ServiceNow Logs" (rulebook datadogwsnowlogs.yml), limited to -snowlogs-
# hosts. That flow has no httpd rule: a web server alert on a -snowlogs- host
# is only logged by the last rule.
#
# Activation extra variables:
#   ao_webhook_path: c8c4e8c2-9a00-4ee2-a1cc-03c5f87a6798   (AIOps Workflow With EDA trigger)
# Host name check uses "-ao-datadog[.]" (a character class). Backslashes in a
# YAML block scalar reach the rulebook condition unchanged, so the earlier
# "-ao-datadog\\." pattern looked for a literal backslash and never matched
# a host name (found in the first end-to-end test, Nov 4, 2026).
- name: Datadog demo lane v2
  hosts: all
  sources:
    - name: Listen for alerts from Datadog v2
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: AO flow - Web Application Down Detected
      condition: >-
        event.payload.event_title == "[Triggered] Web Server is Down_v2"
        and event.payload.hostname is search("-ao-datadog[.]", ignorecase=true)
      action:
        run_job_template:
          name: "EDA Automated Response Automation Orchestrator"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "httpd"
              ao_webhook_path: "{{ ao_webhook_path }}"

    - name: AO flow - High CPU Usage Detected
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-ao-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Enrichment CPU"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "cpu"

    - name: Classic flow - Web Application Down Detected
      condition: >-
        event.payload.event_title == "[Triggered] Web Server is Down_v2"
        and event.payload.hostname is search("-classic-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Automated Response Web Server EDA"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"

    - name: Classic flow - High CPU Usage Detected
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-classic-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Automated Response High CPU EDA"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"

    - name: AI flow - Web Application Down Detected
      condition: >-
        event.payload.event_title == "[Triggered] Web Server is Down_v2"
        and event.payload.hostname is search("-ai-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Response"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "httpd"

    - name: AI flow - High CPU Usage Detected
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-ai-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Enrichment CPU"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "cpu"

    - name: AI MCP flow - Web Application Down Detected
      condition: >-
        event.payload.event_title == "[Triggered] Web Server is Down_v2"
        and event.payload.hostname is search("-aimcp-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Enrichment with MCP"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "httpd"

    - name: AI MCP flow - High CPU Usage Detected
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-aimcp-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Ansible AI Enrichment CPU"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"
              service_issue: "cpu"

    - name: ServiceNow logs flow - High CPU Usage Detected Gather Logs and Correct
      condition: >-
        event.payload.event_title == "[Triggered] CPU Load is high_v2"
        and event.payload.hostname is search("-snowlogs-datadog[.]", ignorecase=true)
      action:
        run_workflow_template:
          name: "Automated Response High CPU Logs"
          organization: Infrastructure
          job_args:
            extra_vars:
              vm_name: "{{ event.payload.hostname }}"

    - name: Log demo lane alerts that no flow handles
      condition: >-
        event.payload.event_title is defined
        and not (event.payload.hostname is search("-(ao|classic|ai|aimcp)-datadog[.]", ignorecase=true) or (event.payload.hostname is search("-snowlogs-datadog[.]", ignorecase=true) and event.payload.event_title == "[Triggered] CPU Load is high_v2"))
      action:
        debug:
          msg: "No demo flow matched {{ event.payload.hostname }}: {{ event.payload.event_title }}"
