---
# First node of the workflow "Datadog Demo Host Build_v2" (tracker step A2).
#
# Works out the demo host name, checks that the build can run, and publishes
# the values the later nodes need with set_stats. AAP passes set_stats data
# to every later node as variables, including the nested workflow
# "Multi Hypervisor Create and Config VM" (646), and it overrides the values
# saved on the workflow nodes.
#
# Inputs (workflow survey):
#   demo_flow  - ao, classic, ai or aimcp; later snowlogs
#   demo_date  - YYYY-MM-DD, the day of the demo
#   owner      - required launch variable: the requester's email address
#
# Host name: <AAP user name>-<MMDD>-<demo_flow>-datadog.shadowman.dev
# Hyphens, not underscores: underscores are not valid in DNS host names.
#
# Credential: "VMWare VCenter Env Cred" (sets VMWARE_HOST, VMWARE_USER and
# VMWARE_PASSWORD, which the certified vmware.vmware and vmware.vmware_rest
# modules read). vmware.vmware has no datastore module, so the free-space
# check uses vmware.vmware_rest, and so does the VM lookup (vmware.vmware.guest_info
# returned no VM for an existing name on Nov 4, 2026).
- name: Plan a Datadog demo host (demo lane v2)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    demo_flows_allowed: [ao, classic, ai, aimcp]
    demo_datacenter: Shadowman-DC
    demo_datastore: vsanDatastore
    demo_min_free_tb: 10
    demo_domain: shadowman.dev
    # Launches from "Reserve Datadog Demo Host_v2" and from ServiceNow use a
    # service account, so awx_user_name names that account, not the SSA.
    # demo_requester (Reserve passes it) or owner (ServiceNow passes it) wins.
    requester: >-
      {{ (demo_requester | default('', true)
          or (owner | default('', true)).split('@')[0]
          or awx_user_name | default(''))
         | lower | regex_replace('[^a-z0-9]', '') }}

  tasks:
    - name: Check the survey answers
      ansible.builtin.assert:
        that:
          - demo_flow is defined
          - demo_flow in demo_flows_allowed
          - demo_date is defined
          - demo_date is match('^\d{4}-\d{2}-\d{2}$')
          - (demo_date | to_datetime('%Y-%m-%d')).date() >= now().date()
          - requester | length > 0
        fail_msg: >-
          demo_flow must be one of {{ demo_flows_allowed | join(', ') }},
          demo_date must be today or later in the form YYYY-MM-DD, and the
          launching AAP user must have a user name.
        quiet: true

    # owner must arrive with the launch of "Datadog Demo Host Build_v2" (its
    # survey question, or a launch variable), not from set_stats here: the
    # survey of workflow 646 answers owner with a blank value, and a nested
    # workflow's survey answer takes precedence over set_stats values from
    # earlier nodes, while launch values do reach the jobs inside 646.
    # Reserve Datadog Demo Host_v2 (1541) fills it from the reserving user's
    # awx_user_email; ServiceNow fills it from the request, because it launches
    # with a service account whose awx_user_email is not the requester's.
    - name: Stop if owner was not given when the workflow was launched
      ansible.builtin.assert:
        that:
          - owner is defined
          - owner is match('^[^@ ]+@[^@ ]+$')
        fail_msg: >-
          owner is empty. When you launch "Datadog Demo Host Build_v2"
          yourself, type your email address in owner, or launch "Reserve
          Datadog Demo Host_v2" instead, which fills owner in from your AAP
          user. ServiceNow fills it in from the request. Launched by {{ awx_user_name | default('unknown') }}
          ({{ awx_user_email | default('no email') }}).
        quiet: true

    - name: Work out the demo host name
      ansible.builtin.set_fact:
        demo_vm_name: >-
          {{ requester }}-{{ (demo_date | to_datetime('%Y-%m-%d')).strftime('%m%d') }}-{{ demo_flow }}-datadog.{{ demo_domain }}

    - name: Read the free space on the datastore the VMware builds use
      vmware.vmware_rest.vcenter_datastore_info:
        names:
          - "{{ demo_datastore }}"
        vcenter_validate_certs: false
      register: demo_ds

    - name: Stop if the datastore has less free space than the agreed threshold
      ansible.builtin.assert:
        that:
          - demo_ds.value | length == 1
          - (demo_ds.value[0].free_space | int) >= (demo_min_free_tb * 1024 ** 4)
        fail_msg: >-
          {{ demo_datastore }} has
          {{ ((demo_ds.value[0].free_space | default(0) | int) / 1024 ** 4) | round(1) }} TB free.
          Demo hosts are built only when at least {{ demo_min_free_tb }} TB is free.
        success_msg: >-
          {{ demo_datastore }} has
          {{ ((demo_ds.value[0].free_space | int) / 1024 ** 4) | round(1) }} TB free.

    - name: Look for an existing VM with the demo host name
      vmware.vmware_rest.vcenter_vm_info:
        names:
          - "{{ demo_vm_name }}"
        vcenter_validate_certs: false
      register: demo_existing

    - name: Stop if a VM with the demo host name already exists
      ansible.builtin.assert:
        that:
          - demo_existing.value | length == 0
        fail_msg: >-
          A VM named {{ demo_vm_name }} already exists. Pick another demo date
          or tear down the existing host first.
        quiet: true

    - name: Publish the values for the rest of the build
      ansible.builtin.set_stats:
        data:
          owner: "{{ owner }}"
          vm_name: "{{ demo_vm_name }}"
          demo_flow: "{{ demo_flow }}"
          demo_date: "{{ demo_date }}"
        per_host: false

    - name: Show the plan
      ansible.builtin.debug:
        msg: >-
          Building {{ demo_vm_name }} for {{ owner }},
          demo flow {{ demo_flow }}, demo date {{ demo_date }}.
