---
# Used by "Disk Issue Setup - Simulate Full /var/log_v2" (demo lane copy of
# job template 1552 "Disk Issue Setup - Simulate Full /var/log").
#
# Same change as shadowman-lab/Ansible-Eventdriven simulate_full_var_log.yml:
# the role simulate_full_var_log (copied into playbooks/roles from commit
# fbdb63d) creates /var/log/messages.gz with fallocate, sized to push / just
# over disk_usage_threshold percent, owned by root and back-dated 6 months, so
# the AO disk workflow finds an old rotated log to clean up.
# Added in front: only the host's owner (the user name at the start of the
# host name) or a demo lane admin may fill a demo host, and only -ao- hosts:
# only the ao flow has disk rules (monitor "Disk Usage is high_v2": warning at
# 80%, alert at 95%).
#
# Inputs: full_disk_host (survey drop-down of -ao- demo hosts),
#         disk_usage_threshold (percent; above 80 for the warning, above 95
#         for the alert).
- name: Check that the launching user owns the demo host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    demo_admins: [mbredeme, adworjan]
    demo_user: "{{ awx_user_name | default('') | lower | regex_replace('[^a-z0-9]', '') }}"
    demo_owner: "{{ full_disk_host | default('') | regex_replace('-.*$', '') }}"
  tasks:
    - name: Refuse a host that is not an ao demo lane host
      ansible.builtin.assert:
        that:
          - full_disk_host is defined
          - full_disk_host is match('^[a-z0-9]+-[0-9]{4}-ao-datadog\.shadowman\.dev$')
        fail_msg: >-
          {{ full_disk_host | default('full_disk_host (not set)') }} is not an
          ao demo lane host. Only the ao flow has a disk demo.
        quiet: true

    - name: Refuse a launching user who does not own the host
      ansible.builtin.assert:
        that:
          - demo_user == demo_owner or demo_user in demo_admins
        fail_msg: >-
          {{ full_disk_host }} belongs to {{ demo_owner }}. Only {{ demo_owner }}
          or a demo lane admin ({{ demo_admins | join(', ') }}) may fill it;
          you are {{ demo_user }}.
        quiet: true

- name: Simulate full /var/log (demo lane v2)
  hosts: "{{ full_disk_host }}"
  gather_facts: false
  become: true
  roles:
    - simulate_full_var_log
