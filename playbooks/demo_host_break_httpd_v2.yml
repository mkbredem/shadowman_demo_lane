---
# Used by "AIOps Setup - Break HTTPD_v2" (tracker step A13).
#
# The break depends on the demo flow in the host name, so that each flow's
# remediation can fix it:
#   ao, ai (and the other AI flows): same change as shadowman-lab/Ansible-Eventdriven
#     httpd_break.yml (role httpd_break). Adds the line InvalidDirectiveHere
#     after ServerRoot in /etc/httpd/conf/httpd.conf and restarts httpd, which
#     then fails to start. The AI paths read the log and restore httpd.conf.
#   classic: stops httpd (systemctl stop httpd), the same as job template
#     "Web Application Stop" (1007). The classic remediation, "Automated
#     Response Web Server EDA" -> "Restart and Verify Web App" (300), only
#     starts httpd, so it cannot fix a broken httpd.conf.
# Added in front: only the host's owner (the user name at the start of the
# host name) or a demo lane admin may break a demo host. No date limit: the
# owner may rehearse on any day until the teardown.
#
# Input: host_to_break (survey drop-down of reserved demo hosts).
- name: Check that the launching user owns the demo host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    demo_admins: [mbredeme, adworjan]
    demo_user: "{{ awx_user_name | default('') | lower | regex_replace('[^a-z0-9]', '') }}"
    demo_owner: "{{ host_to_break | default('') | regex_replace('-.*$', '') }}"
  tasks:
    - name: Refuse a host that is not a demo lane host
      ansible.builtin.assert:
        that:
          - host_to_break is defined
          - host_to_break is match('^[a-z0-9]+-[0-9]{4}-(ao|classic|ai|aimcp|snowlogs)-datadog\.shadowman\.dev$')
        fail_msg: "{{ host_to_break | default('host_to_break (not set)') }} is not a reserved demo lane host."
        quiet: true

    - name: Refuse a launching user who does not own the host
      ansible.builtin.assert:
        that:
          - demo_user == demo_owner or demo_user in demo_admins
        fail_msg: >-
          {{ host_to_break }} belongs to {{ demo_owner }}. Only {{ demo_owner }}
          or a demo lane admin ({{ demo_admins | join(', ') }}) may break it;
          you are {{ demo_user }}. Reserve your own demo host.
        quiet: true

- name: Break HTTPD (demo lane v2)
  hosts: "{{ host_to_break }}"
  gather_facts: false
  become: true
  vars:
    # Host name <user>-<MMDD>-<flow>-datadog.shadowman.dev (checked above):
    # the third part is the demo flow.
    demo_flow: "{{ inventory_hostname.split('-')[2] }}"
  tasks:
    - name: Stop httpd (classic flow)
      ansible.builtin.systemd_service:
        name: httpd
        state: stopped
      when: demo_flow == 'classic'

    - name: Add InvalidDirectiveHere (ao and AI flows)
      when: demo_flow != 'classic'
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        insertafter: '^ServerRoot'
        line: 'InvalidDirectiveHere'
        state: present
      notify: restart apache

  handlers:
    - name: restart apache
      ansible.builtin.service:
        name: httpd
        state: restarted
      ignore_errors: true
