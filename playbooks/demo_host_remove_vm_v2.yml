---
# Removes a demo lane VM from vCenter by name, from localhost.
#
# "Unsubscribe and remove VMs from Multi Citrix" (450) removes VMs through the
# inventory, so it cannot remove a VM that never reached the inventory. The
# VMware inventory source only picks up VMs tagged ansible_managed, and a VM
# build that fails before tagging leaves an untagged VM. This playbook removes
# such a VM, and the teardown (step A3) uses it as a last step so the VM is
# gone even when the inventory no longer lists it.
#
# Same modules and steps as roles/shadowman_deprovision/tasks/vmware_vm_remove.yml
# in shadowman-lab/Ansible-Provision (certified vmware.vmware collection).
#
# Input: vm_name. Refuses any name that is not a demo lane host name.
# Credential: "VMWare VCenter Env Cred".
- name: Remove a demo lane VM from vCenter (demo lane v2)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    demo_datacenter: Shadowman-DC

  tasks:
    - name: Refuse anything that is not a demo lane host name
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name is match('^[a-z0-9]+-[0-9]{4}-(ao|classic|ai|aimcp|snowlogs)-datadog\.shadowman\.dev$')
        fail_msg: >-
          {{ vm_name | default('vm_name (not set)') }} is not a demo lane host
          name (<user>-<MMDD>-<flow>-datadog.shadowman.dev). Nothing removed.
        quiet: true

    # vmware.vmware.guest_info returned no VM for this name on Nov 4, 2026
    # while the VM existed (moid vm-6299), so the lookup uses the vCenter REST
    # API through the certified vmware.vmware_rest collection.
    - name: Look up the VM in vCenter
      vmware.vmware_rest.vcenter_vm_info:
        names:
          - "{{ vm_name }}"
        vcenter_validate_certs: false
      register: demo_vm

    - name: Show what vCenter returned
      ansible.builtin.debug:
        var: demo_vm.value

    # Optional: vm_moid (for example vm-6299, from the build job's
    # "Check RHEL VM Creation status" result) when the name lookup finds
    # nothing. Shows the VM's current name and power state; deletes nothing.
    - name: Look up the VM by its vCenter ID
      vmware.vmware_rest.vcenter_vm_info:
        vm: "{{ vm_moid }}"
        vcenter_validate_certs: false
      register: demo_vm_by_id
      failed_when: false
      when: vm_moid is defined

    - name: Show what vCenter returned for that ID
      ansible.builtin.debug:
        msg: >-
          {{ vm_moid }}: name {{ demo_vm_by_id.value.name | default('not found') }},
          power {{ demo_vm_by_id.value.power_state | default('unknown') }}
          {{ demo_vm_by_id.msg | default('') }}
      when: vm_moid is defined

    - name: Report when there is no VM to remove
      ansible.builtin.debug:
        msg: "No VM named {{ vm_name }} in vCenter. Nothing to remove."
      when: demo_vm.value | length == 0

    - name: Stop if more than one VM has this name
      ansible.builtin.assert:
        that:
          - demo_vm.value | length <= 1
        fail_msg: "{{ demo_vm.value | length }} VMs are named {{ vm_name }}. Remove them by hand."
        quiet: true

    - name: Turn off the VM
      vmware.vmware.vm_powerstate:
        moid: "{{ demo_vm.value[0].vm }}"
        datacenter: "{{ demo_datacenter }}"
        state: powered-off
        validate_certs: false
      when: demo_vm.value | length == 1

    - name: Delete the VM
      vmware.vmware.vm:
        state: absent
        moid: "{{ demo_vm.value[0].vm }}"
        validate_certs: false
      when: demo_vm.value | length == 1
